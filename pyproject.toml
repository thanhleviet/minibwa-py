[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minibwa-py"
version = "0.1.0"
description = "Pure-Python subprocess wrapper for the minibwa aligner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "minibwa-py contributors" }]
keywords = ["bioinformatics", "alignment", "sam", "paf", "minibwa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/thanhleviet/minibwa-py"
Repository = "https://github.com/thanhleviet/minibwa-py"
Changelog = "https://github.com/thanhleviet/minibwa-py/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/minibwa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/minibwa"]

[tool.hatch.build.targets.wheel.force-include]
"src/minibwa/py.typed" = "minibwa/py.typed"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the real minibwa binary"]
addopts = "-ra"
